name: Backend Check

on:
  push:
    branches: [ main ]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Syntax check
      run: |
        cd backend
        python -m py_compile *.py
